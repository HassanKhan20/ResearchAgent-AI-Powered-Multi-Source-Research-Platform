<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b0f1c"/><stop offset="1" stop-color="#070912"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 20) rotate(30) scale(620 340)">
      <stop stop-color="#6366f1" stop-opacity="0.35"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1180 360) rotate(200) scale(560 300)">
      <stop stop-color="#22d3ee" stop-opacity="0.22"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="text" x1="0" y1="0" x2="560" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a5b4fc"/><stop offset="0.5" stop-color="#7dd3fc"/><stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818cf8"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glowA)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glowB)"/>

  <g transform="translate(80 78)">
    <rect width="64" height="64" rx="16" fill="#121829" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="28" cy="28" r="13" stroke="url(#logo)" stroke-width="5"/>
    <path d="M38 38l11 11" stroke="url(#logo)" stroke-width="6" stroke-linecap="round"/>
    <path d="M22 28.5l4 4 8-9" stroke="#e0e7ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="84" y="44" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">ResearchAgent</text>
  </g>

  <text x="80" y="218" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#ffffff">Ask anything. Get a</text>
  <text x="80" y="276" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="url(#text)">cited, cross-checked report.</text>
  <text x="80" y="324" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#94a3b8">LangGraph agents search sources, cross-check facts and flag contradictions.</text>

  <!-- pipeline -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <g transform="translate(860 52)">
      <path d="M22 40v24M22 104v24M22 168v24M22 232v24" stroke="#818cf8" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="4 5"/>
      <g>
        <rect width="290" height="40" rx="12" fill="#1b2338" stroke="#818cf8" stroke-opacity="0.4"/>
        <circle cx="22" cy="20" r="7" fill="#818cf8"/>
        <text x="42" y="25" fill="#e0e7ff">Plan  ·  sub-queries</text>
      </g>
      <g transform="translate(0 64)">
        <rect width="290" height="40" rx="12" fill="#1b2338" stroke="#38bdf8" stroke-opacity="0.4"/>
        <circle cx="22" cy="20" r="7" fill="#38bdf8"/>
        <text x="42" y="25" fill="#e0f2fe">Search  ·  web · wiki · arXiv</text>
      </g>
      <g transform="translate(0 128)">
        <rect width="290" height="40" rx="12" fill="#1b2338" stroke="#22d3ee" stroke-opacity="0.4"/>
        <circle cx="22" cy="20" r="7" fill="#22d3ee"/>
        <text x="42" y="25" fill="#cffafe">Extract  ·  atomic claims</text>
      </g>
      <g transform="translate(0 192)">
        <rect width="290" height="40" rx="12" fill="#2a1622" stroke="#fb7185" stroke-opacity="0.45"/>
        <circle cx="22" cy="20" r="7" fill="#fb7185"/>
        <text x="42" y="25" fill="#ffe4e6">Cross-check  ·  2 conflicts</text>
      </g>
      <g transform="translate(0 256)">
        <rect width="290" height="40" rx="12" fill="#13241f" stroke="#34d399" stroke-opacity="0.45"/>
        <circle cx="22" cy="20" r="7" fill="#34d399"/>
        <text x="42" y="25" fill="#d1fae5">Write  ·  cited report [1][3]</text>
      </g>
    </g>
  </g>
</svg>
